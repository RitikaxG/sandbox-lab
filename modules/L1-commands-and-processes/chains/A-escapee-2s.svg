<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="985" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b42318"/></marker></defs>
<rect width="1280" height="985" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#111">Chain A: a setsid escapee makes the stop take 2 s (Break 3, #39; 3 runs)</text>
<rect x="100" y="70" width="230" height="844" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="215.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">AGENT</text>
<rect x="330" y="70" width="300" height="844" fill="#ffffff" stroke="#d0d5dd"/>
<text x="480.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">OUR API</text>
<rect x="630" y="70" width="300" height="844" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="780.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">DOCKER</text>
<rect x="930" y="70" width="330" height="844" fill="#ffffff" stroke="#d0d5dd"/>
<text x="1095.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">SANDBOX PROCESSES</text>
<text x="12" y="90" font-weight="bold" fill="#111">time</text>
<line x1="92" y1="100" x2="92" y2="908" stroke="#98a2b3" marker-end="url(#ah)"/>
<text x="12" y="118" fill="#475467" font-weight="bold">0 ms</text>
<text x="12" y="224" fill="#475467" font-weight="bold">1,002 ms</text>
<text x="12" y="313" fill="#475467" font-weight="bold">~1,0xx ms</text>
<text x="12" y="419" fill="#475467" font-weight="bold">waiting</text>
<text x="12" y="508" fill="#475467" font-weight="bold">~3,030 ms</text>
<text x="12" y="597" fill="#475467" font-weight="bold">~3,050 ms</text>
<text x="12" y="720" fill="#475467" font-weight="bold">~3,120 ms</text>
<text x="12" y="843" fill="#475467" font-weight="bold">then</text>
<rect x="108" y="100" width="214" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="118" fill="#111">POST /exec timeout_s=1</text>
<text x="118" y="135" fill="#111">sh -c 'sleep 3600 &amp;</text>
<text x="118" y="152" fill="#111">setsid sleep 3601 &amp; wait'</text>
<rect x="338" y="100" width="284" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="118" fill="#111">docker exec (output = one pipe)</text>
<rect x="938" y="100" width="314" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="948" y="118" fill="#111">sh: leader of its own group + session</text>
<text x="948" y="135" fill="#111">sleep 3600: in sh's group</text>
<text x="948" y="152" fill="#111">setsid sleep 3601: NEW group + session</text>
<text x="948" y="169" fill="#111">all three hold the output pipe</text>
<rect x="338" y="206" width="284" height="63" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="348" y="224" fill="#111">timeout fires</text>
<text x="348" y="241" fill="#111">kill helper exec: SIGTERM to sh's</text>
<text x="348" y="258" fill="#111">group</text>
<rect x="938" y="206" width="314" height="63" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="948" y="224" fill="#111">sh dies (SIGTERM, 143)</text>
<text x="948" y="241" fill="#111">sleep 3600 dies</text>
<text x="948" y="258" fill="#111">sleep 3601 missed: other group</text>
<rect x="638" y="295" width="284" height="80" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="648" y="313" fill="#111">sees the exec's main process (sh)</text>
<text x="648" y="330" fill="#111">exit</text>
<text x="648" y="347" fill="#111">-&gt; waits up to 2 s for the output</text>
<text x="648" y="364" fill="#111">to close</text>
<rect x="938" y="295" width="314" height="80" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="948" y="313" fill="#111">sleep 3601 runs on, parent -&gt; PID 1</text>
<text x="948" y="330" fill="#111">(tini)</text>
<text x="948" y="347" fill="#111">still holds the output pipe</text>
<rect x="338" y="401" width="284" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="419" fill="#111">still inside the SIGTERM step</text>
<text x="348" y="436" fill="#111">(normally ~40 ms)</text>
<rect x="638" y="401" width="284" height="63" rx="6" fill="#eef2ff" stroke="#3538cd" stroke-width="1.5"/>
<text x="648" y="419" fill="#111">helper exec's exit event queued</text>
<text x="648" y="436" fill="#111">behind sh's (one event at a time</text>
<text x="648" y="453" fill="#111">per container) [INFERENCE]</text>
<rect x="638" y="490" width="284" height="63" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="648" y="508" fill="#111">2 s up: Docker cuts the output</text>
<text x="648" y="525" fill="#111">itself</text>
<text x="648" y="542" fill="#111">then handles the helper's exit</text>
<rect x="338" y="579" width="284" height="97" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="597" fill="#111">helper returns after ~2,045 ms</text>
<text x="348" y="614" fill="#111">SIGKILL the group: 35-41 ms, group</text>
<text x="348" y="631" fill="#111">already empty</text>
<text x="348" y="648" fill="#111">no extra wait: output already</text>
<text x="348" y="665" fill="#111">closed</text>
<rect x="108" y="702" width="214" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="720" fill="#111">200 exit 143 (sh's:</text>
<text x="118" y="737" fill="#111">128+15)</text>
<text x="118" y="754" fill="#111">stopped_by timeout</text>
<text x="118" y="771" fill="#111">stop_ms ~2,087</text>
<text x="118" y="788" fill="#111">leaks: [sleep 3601]</text>
<rect x="338" y="702" width="284" height="97" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="720" fill="#111">leak count: ps vs the create-time</text>
<text x="348" y="737" fill="#111">baseline -&gt; sleep 3601</text>
<rect x="108" y="825" width="214" height="63" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="843" fill="#111">POST /exec echo hi</text>
<text x="118" y="860" fill="#111">-&gt; exit 0, leaks: [sleep</text>
<text x="118" y="877" fill="#111">3601] again</text>
<rect x="338" y="825" width="284" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="843" fill="#111">same count vs the create-time</text>
<text x="348" y="860" fill="#111">baseline: blames echo for an old</text>
<text x="348" y="877" fill="#111">leak (postmortem 002 G3)</text>
<rect x="938" y="825" width="314" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="948" y="843" fill="#111">echo runs and exits 0</text>
<text x="948" y="860" fill="#111">sleep 3601 still running</text>
<line x1="622" y1="237.5" x2="938" y2="237.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="784.0" y="233.5" font-size="11" font-style="italic" fill="#b42318">causes</text>
<line x1="938" y1="237.5" x2="922" y2="335.0" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="934.0" y="282.25" font-size="11" font-style="italic" fill="#b42318">sh's exit starts the clock</text>
<line x1="938" y1="335.0" x2="922" y2="521.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="934.0" y="424.25" font-size="11" font-style="italic" fill="#b42318">keeps it open the full 2 s</text>
<line x1="638" y1="521.5" x2="622" y2="627.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="634.0" y="570.5" font-size="11" font-style="italic" fill="#b42318">unblocks</text>
<text x="20" y="928" font-size="12" fill="#475467">Measured: timeout 1,002 ms; SIGTERM helper 2,049 / 2,045 / 2,046 ms; stop_ms 2,091 / 2,081 / 2,087. Docker's 2 s: SOURCE-VERIFIED (moby v29.0.0</text>
<text x="20" y="945" font-size="12" fill="#475467">daemon/monitor.go ProcessEvent EventExit, WithTimeout 2 s, StreamConfig.Wait). No-wait control: sh exits on its own at ~0 ms, Docker's cut at ~2.0 s, not</text>
<text x="20" y="962" font-size="12" fill="#475467">1,002 + 2,000: the clock follows sh's exit, not the timeout. Source: sandbox-lab results/l1-setsid.csv.</text>
</svg>