<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="934" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b42318"/></marker></defs>
<rect width="1280" height="934" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#111">Chain B2: the same bomb, pids.max = 1,000 (Break 4 control, #41; 1 run)</text>
<rect x="100" y="70" width="230" height="810" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="215.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">AGENT</text>
<rect x="330" y="70" width="300" height="810" fill="#ffffff" stroke="#d0d5dd"/>
<text x="480.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">OUR API</text>
<rect x="630" y="70" width="300" height="810" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="780.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">DOCKER + ITS ONE VM</text>
<rect x="930" y="70" width="330" height="810" fill="#ffffff" stroke="#d0d5dd"/>
<text x="1095.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">SANDBOX PROCESSES</text>
<text x="12" y="90" font-weight="bold" fill="#111">time</text>
<line x1="92" y1="100" x2="92" y2="874" stroke="#98a2b3" marker-end="url(#ah)"/>
<text x="12" y="118" fill="#475467" font-weight="bold">0 ms</text>
<text x="12" y="207" fill="#475467" font-weight="bold">~0 ms</text>
<text x="12" y="279" fill="#475467" font-weight="bold">0.2 s</text>
<text x="12" y="402" fill="#475467" font-weight="bold">2,039 ms</text>
<text x="12" y="491" fill="#475467" font-weight="bold">~2,570 ms</text>
<text x="12" y="597" fill="#475467" font-weight="bold">2,599 ms</text>
<text x="12" y="720" fill="#475467" font-weight="bold">then</text>
<text x="12" y="843" fill="#475467" font-weight="bold">after</text>
<rect x="108" y="100" width="214" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="118" fill="#111">POST /exec timeout_s=3</text>
<text x="118" y="135" fill="#111">(same bomb)</text>
<rect x="938" y="100" width="314" height="63" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="948" y="118" fill="#111">sh starts bomb | bomb &amp; and exits 0 at</text>
<text x="948" y="135" fill="#111">once</text>
<text x="948" y="152" fill="#111">bombs inherit the output pipe</text>
<rect x="638" y="189" width="284" height="46" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="648" y="207" fill="#111">sees sh exit -&gt; waits up to 2 s</text>
<text x="648" y="224" fill="#111">for the output to close</text>
<rect x="938" y="261" width="314" height="97" rx="6" fill="#e7f6ec" stroke="#067647" stroke-width="1.5"/>
<text x="948" y="279" fill="#111">count 2 -&gt; 986 in one sample; then</text>
<text x="948" y="296" fill="#111">889-1,000: bombs exit and refill freed</text>
<text x="948" y="313" fill="#111">slots; peak 1,000</text>
<text x="948" y="330" fill="#111">limit contains it: rest of the VM</text>
<text x="948" y="347" fill="#111">untouched</text>
<rect x="338" y="384" width="284" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="402" fill="#111">exec-run returns: exit 0 (sh's</text>
<text x="348" y="419" fill="#111">own); timeout never fired, stop</text>
<text x="348" y="436" fill="#111">step never runs</text>
<rect x="638" y="384" width="284" height="63" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="648" y="402" fill="#111">2 s up: Docker cuts the output</text>
<text x="648" y="419" fill="#111">itself</text>
<rect x="338" y="473" width="284" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="491" fill="#111">leak count: ps helper got a freed</text>
<text x="348" y="508" fill="#111">slot (~530 ms) -&gt; 1,007 rows, more</text>
<text x="348" y="525" fill="#111">than the limit [INFERENCE: a</text>
<text x="348" y="542" fill="#111">moving set]</text>
<rect x="108" y="579" width="214" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="597" fill="#111">200 exit 0</text>
<text x="118" y="614" fill="#111">stopped_by none, stop 0</text>
<text x="118" y="631" fill="#111">leaks: 1,007</text>
<text x="118" y="648" fill="#111">stderr 596 KB of fork</text>
<text x="118" y="665" fill="#111">failures</text>
<rect x="108" y="702" width="214" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="720" fill="#111">echo hi: 200 in 65 ms</text>
<text x="118" y="737" fill="#111">exit 128, no output,</text>
<text x="118" y="754" fill="#111">leaks 0</text>
<rect x="338" y="702" width="284" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="348" y="720" fill="#111">returns 200 for a command that</text>
<text x="348" y="737" fill="#111">never ran; its ps helper can't</text>
<text x="348" y="754" fill="#111">start either and our run helper</text>
<text x="348" y="771" fill="#111">ignores the failure -&gt; 'leaks 0'</text>
<text x="348" y="788" fill="#111">(G2)</text>
<rect x="938" y="702" width="314" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="948" y="720" fill="#111">no free slot: echo can't start [128</text>
<text x="948" y="737" fill="#111">meaning: INFERENCE, source check Thu</text>
<text x="948" y="754" fill="#111">Nov 5]</text>
<text x="948" y="771" fill="#111">999 still running</text>
<rect x="108" y="825" width="214" height="29" rx="6" fill="#e7f6ec" stroke="#067647" stroke-width="1.5"/>
<text x="118" y="843" fill="#111">delete: 204 in 445 ms</text>
<rect x="638" y="825" width="284" height="29" rx="6" fill="#e7f6ec" stroke="#067647" stroke-width="1.5"/>
<text x="648" y="843" fill="#111">docker ps: 129 ms</text>
<line x1="938" y1="131.5" x2="922" y2="212.0" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="780.0" y1="235" x2="780.0" y2="384" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="784.0" y="305.5" font-size="11" font-style="italic" fill="#b42318">bombs hold the pipe</text>
<line x1="638" y1="415.5" x2="622" y2="415.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="938" y1="750.5" x2="622" y2="750.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="784.0" y="746.5" font-size="11" font-style="italic" fill="#b42318">no slot for echo or ps</text>
<text x="20" y="894" font-size="12" fill="#475467">Measured: pids.current read every 0.2 s by a watcher that never forks (bin/pidwatch.log); 999 alive 3 s after the call. With the limit the damage stays in one</text>
<text x="20" y="911" font-size="12" fill="#475467">sandbox: Docker and delete still work, but the sandbox can't start anything and our API reports it as success. Source: results/l1-forkbomb.csv.</text>
</svg>