<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="752" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b42318"/></marker></defs>
<rect width="1280" height="752" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#111">Chain C: Ctrl-C in a terminal, and the hang-up that follows (#42 C, #43 C2; 1 run each)</text>
<rect x="100" y="70" width="220" height="628" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="210.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">AGENT</text>
<rect x="320" y="70" width="220" height="628" fill="#ffffff" stroke="#d0d5dd"/>
<text x="430.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">OUR API</text>
<rect x="540" y="70" width="330" height="628" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="705.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">DOCKER + TERMINAL</text>
<rect x="870" y="70" width="390" height="628" fill="#ffffff" stroke="#d0d5dd"/>
<text x="1065.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">SANDBOX PROCESSES</text>
<text x="12" y="90" font-weight="bold" fill="#111">time</text>
<line x1="92" y1="100" x2="92" y2="692" stroke="#98a2b3" marker-end="url(#ah)"/>
<text x="12" y="118" fill="#475467" font-weight="bold">0 ms</text>
<text x="12" y="258" fill="#475467" font-weight="bold">1,500 ms</text>
<text x="12" y="347" fill="#475467" font-weight="bold">+ few ms</text>
<text x="12" y="470" fill="#475467" font-weight="bold">next</text>
<text x="12" y="593" fill="#475467" font-weight="bold">+53-55 ms</text>
<rect x="108" y="100" width="204" height="114" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="118" fill="#111">terminal mode</text>
<text x="118" y="135" fill="#111">(WebSocket)</text>
<text x="118" y="152" fill="#111">C: sh -c 'sleep 601 &amp;</text>
<text x="118" y="169" fill="#111">sleep 602'</text>
<text x="118" y="186" fill="#111">C2: same + trap "" HUP</text>
<rect x="548" y="100" width="314" height="114" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="558" y="118" fill="#111">exec with a terminal; sh is the</text>
<text x="558" y="135" fill="#111">session leader that controls it</text>
<rect x="878" y="100" width="374" height="114" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="888" y="118" fill="#111">sh: leader of its own group + session</text>
<text x="888" y="135" fill="#111">sleep 601 (&amp;): sh's group; non-interactive sh</text>
<text x="888" y="152" fill="#111">sets SIGINT + SIGQUIT ignored (SigIgn 6, #21)</text>
<text x="888" y="169" fill="#111">sleep 602: sh's group, in the foreground</text>
<text x="888" y="186" fill="#111">C2 only: SIGHUP ignored in sh, inherited by</text>
<text x="888" y="203" fill="#111">both sleeps</text>
<rect x="108" y="240" width="204" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="258" fill="#111">sends the Ctrl-C byte</text>
<rect x="328" y="240" width="204" height="63" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="338" y="258" fill="#111">writes it into the</text>
<text x="338" y="275" fill="#111">terminal</text>
<rect x="548" y="240" width="314" height="63" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="558" y="258" fill="#111">terminal driver turns ^C into SIGINT</text>
<text x="558" y="275" fill="#111">(signal 2) for the foreground group =</text>
<text x="558" y="292" fill="#111">sh's group</text>
<rect x="878" y="329" width="374" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="888" y="347" fill="#111">sleep 602 dies (SIGINT)</text>
<text x="888" y="364" fill="#111">sh exits 130 = 128 + 2 [by SIGINT itself or</text>
<text x="888" y="381" fill="#111">passing on sleep 602's status: not checked;</text>
<text x="888" y="398" fill="#111">same number]</text>
<text x="888" y="415" fill="#111">sleep 601 survives: SIGINT ignored</text>
<rect x="548" y="452" width="314" height="97" rx="6" fill="#eef2ff" stroke="#3538cd" stroke-width="1.5"/>
<text x="558" y="470" fill="#111">the controlling process (sh) died -&gt;</text>
<text x="558" y="487" fill="#111">SIGHUP to the terminal's foreground</text>
<text x="558" y="504" fill="#111">group [that the kernel sends it on</text>
<text x="558" y="521" fill="#111">sh's exit: INFERENCE; the pair proves</text>
<text x="558" y="538" fill="#111">only that SIGHUP did it]</text>
<rect x="878" y="452" width="374" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="888" y="470" fill="#111">C: sleep 601 dies of SIGHUP (not ignored) -&gt;</text>
<text x="888" y="487" fill="#111">0 leaks</text>
<text x="888" y="504" fill="#111">C2: sleep 601 ignores SIGHUP -&gt; runs on,</text>
<text x="888" y="521" fill="#111">parent -&gt; PID 1</text>
<rect x="108" y="575" width="204" height="97" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="593" fill="#111">C: exit 130, stopped_by</text>
<text x="118" y="610" fill="#111">none, 0 leaks</text>
<text x="118" y="627" fill="#111">C2: exit 130,</text>
<text x="118" y="644" fill="#111">stopped_by none, 1</text>
<text x="118" y="661" fill="#111">leak: sleep 601</text>
<rect x="548" y="575" width="314" height="97" rx="6" fill="#eef2ff" stroke="#3538cd" stroke-width="1.5"/>
<text x="558" y="593" fill="#111">no 2 s wait, although in C2 sleep 601</text>
<text x="558" y="610" fill="#111">still has the terminal open: WHY =</text>
<text x="558" y="627" fill="#111">UNKNOWN (record's 'hang-up cuts every</text>
<text x="558" y="644" fill="#111">holder' doubted for ptys; check Thu</text>
<text x="558" y="661" fill="#111">Nov 5)</text>
<line x1="862" y1="271.5" x2="878" y2="377.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="874.0" y="320.5" font-size="11" font-style="italic" fill="#b42318">SIGINT</text>
<line x1="878" y1="377.5" x2="862" y2="500.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="874.0" y="435.0" font-size="11" font-style="italic" fill="#b42318">sh's exit</text>
<line x1="862" y1="500.5" x2="878" y2="500.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="20" y="712" font-size="12" fill="#475467">Controlled pair: C and C2 differ only by trap "" HUP, so SIGHUP from the hang-up is what killed sleep 601 in C (OBSERVED by the pair). A '&amp;' child of a</text>
<text x="20" y="729" font-size="12" fill="#475467">non-interactive sh ignores SIGINT and SIGQUIT only, not every signal: that is why SIGHUP still reaches it. Source: results/l1-terminal.csv (rows C, C2).</text>
</svg>