<line x1="638" y1="415.5" x2="622" y2="415.5" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="20" y="754" font-size="12" fill="#475467">Measured: exec-run 2,056 ms; no answers within 60 s; VM 664% CPU at 8 min; restart 129 s, docker ps after 131 s. Process count UNKNOWN (the docker stats</text>
<text x="20" y="771" font-size="12" fill="#475467">watcher returned no sample; instrument untested). Source: results/l1-forkbomb.csv.</text>
