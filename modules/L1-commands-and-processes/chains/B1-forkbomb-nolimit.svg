<text x="780.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">DOCKER + ITS ONE VM</text>
<rect x="930" y="70" width="330" height="670" fill="#ffffff" stroke="#d0d5dd"/>
<text x="1095.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">SANDBOX PROCESSES</text>
<text x="12" y="90" font-weight="bold" fill="#111">time</text>
<line x1="92" y1="100" x2="92" y2="734" stroke="#98a2b3" marker-end="url(#ah)"/>
<text x="12" y="118" fill="#475467" font-weight="bold">0 ms</text>
<text x="12" y="224" fill="#475467" font-weight="bold">~0 ms</text>
<text x="12" y="330" fill="#475467" font-weight="bold">2,056 ms</text>
<text x="12" y="402" fill="#475467" font-weight="bold">next</text>
<text x="12" y="491" fill="#475467" font-weight="bold">60 s</text>
<text x="12" y="563" fill="#475467" font-weight="bold">8 min</text>
<text x="12" y="635" fill="#475467" font-weight="bold">+131 s</text>
<rect x="108" y="100" width="214" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="118" fill="#111">POST /exec timeout_s=3</text>
<text x="118" y="135" fill="#111">sh -c 'bomb() { bomb |</text>
<text x="118" y="152" fill="#111">bomb &amp; }; bomb'</text>
<rect x="338" y="100" width="284" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="118" fill="#111">docker exec (output = one pipe)</text>
<rect x="938" y="100" width="314" height="80" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="948" y="118" fill="#111">sh starts bomb | bomb &amp; and exits 0 at</text>
<text x="948" y="135" fill="#111">once</text>
<text x="948" y="152" fill="#111">bomb children inherit the output pipe</text>
<text x="948" y="169" fill="#111">and multiply</text>
<rect x="638" y="206" width="284" height="80" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="648" y="224" fill="#111">sees the exec's main process (sh)</text>
<text x="648" y="241" fill="#111">exit</text>
<text x="648" y="258" fill="#111">-&gt; waits up to 2 s for the output</text>
<text x="648" y="275" fill="#111">to close</text>
<rect x="338" y="312" width="284" height="46" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="348" y="330" fill="#111">exec-run returns (timeout never</text>
<text x="348" y="347" fill="#111">fired: stop step never runs)</text>
<rect x="638" y="312" width="284" height="46" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="648" y="330" fill="#111">2 s up: Docker cuts the output</text>
<text x="648" y="347" fill="#111">itself</text>
<rect x="338" y="384" width="284" height="63" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="348" y="402" fill="#111">leak count: ps helper exec, NO</text>
<text x="348" y="419" fill="#111">deadline in our code (postmortem</text>
<text x="348" y="436" fill="#111">002 G2)</text>
<rect x="638" y="384" width="284" height="63" rx="6" fill="#eef2ff" stroke="#3538cd" stroke-width="1.5"/>
<text x="648" y="402" fill="#111">helper never answers: VM starved</text>
<text x="648" y="419" fill="#111">[peak count UNKNOWN; PIDs or</text>
<text x="648" y="436" fill="#111">memory: INFERENCE]</text>
<rect x="938" y="384" width="314" height="63" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="948" y="402" fill="#111">bomb keeps growing: one kernel, one VM</text>
<text x="948" y="419" fill="#111">shared by every container and by</text>
<text x="948" y="436" fill="#111">dockerd</text>
<rect x="108" y="473" width="214" height="46" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="491" fill="#111">bomb call: no answer</text>
<text x="118" y="508" fill="#111">echo hi: no answer</text>
<rect x="338" y="473" width="284" height="46" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="348" y="491" fill="#111">delete: no answer</text>
<rect x="638" y="473" width="284" height="46" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="648" y="491" fill="#111">docker ps, docker rm -f: no answer</text>
<rect x="638" y="545" width="284" height="46" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="648" y="563" fill="#111">docker ps still no answer</text>
<text x="648" y="580" fill="#111">VM process at 664% CPU (8 CPUs)</text>
<rect x="638" y="617" width="284" height="97" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="648" y="635" fill="#111">docker desktop restart (with</text>
<text x="648" y="652" fill="#111">Ritika's OK): docker ps answers</text>
<text x="648" y="669" fill="#111">after 131 s</text>
<text x="648" y="686" fill="#111">container left Exited (255) =</text>
<text x="648" y="703" fill="#111">'died unseen' (L0 #12)</text>
<line x1="938" y1="140.0" x2="922" y2="246.0" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="934.0" y="189.0" font-size="11" font-style="italic" fill="#b42318">sh's exit starts the clock</text>
