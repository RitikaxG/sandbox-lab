<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="565" font-family="Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b42318"/></marker></defs>
<rect width="1280" height="565" fill="#ffffff"/>
<text x="20" y="32" font-size="19" font-weight="bold" fill="#111">3. Ctrl-C in a terminal: the hang-up, not Ctrl-C, cleans up the background job</text>
<rect x="100" y="70" width="230" height="458" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="215.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">THE AGENT</text>
<rect x="330" y="70" width="290" height="458" fill="#ffffff" stroke="#d0d5dd"/>
<text x="475.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">OUR SANDBOX API</text>
<rect x="620" y="70" width="290" height="458" fill="#f7f7f8" stroke="#d0d5dd"/>
<text x="765.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">DOCKER</text>
<rect x="910" y="70" width="350" height="458" fill="#ffffff" stroke="#d0d5dd"/>
<text x="1085.0" y="90" text-anchor="middle" font-weight="bold" fill="#111">INSIDE THE SANDBOX</text>
<text x="12" y="90" font-weight="bold" fill="#111">time</text>
<line x1="92" y1="100" x2="92" y2="522" stroke="#98a2b3" marker-end="url(#ah)"/>
<text x="12" y="118" fill="#475467" font-weight="bold">start</text>
<text x="12" y="224" fill="#475467" font-weight="bold">1.5 s</text>
<text x="12" y="330" fill="#475467" font-weight="bold">next</text>
<text x="12" y="402" fill="#475467" font-weight="bold">+55 ms</text>
<text x="12" y="474" fill="#475467" font-weight="bold">same run</text>
<text x="12" y="491" fill="#475467" font-weight="bold">with trap</text>
<text x="12" y="508" fill="#475467" font-weight="bold">"" HUP</text>
<rect x="108" y="100" width="214" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="118" fill="#111">Open a terminal. Run:</text>
<text x="118" y="135" fill="#111">sh -c 'sleep 601 &amp; sleep</text>
<text x="118" y="152" fill="#111">602'</text>
<rect x="918" y="100" width="334" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="928" y="118" fill="#111">all three in one process group, the</text>
<text x="928" y="135" fill="#111">terminal's foreground group</text>
<text x="928" y="152" fill="#111">sh runs sleep 601 in the background with</text>
<text x="928" y="169" fill="#111">Ctrl-C (SIGINT) ignored</text>
<rect x="108" y="206" width="214" height="80" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.5"/>
<text x="118" y="224" fill="#111">Press Ctrl-C</text>
<rect x="628" y="206" width="274" height="80" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="638" y="224" fill="#111">The terminal turns Ctrl-C into</text>
<text x="638" y="241" fill="#111">SIGINT for the foreground group</text>
<rect x="918" y="206" width="334" height="80" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="928" y="224" fill="#111">sleep 602 stops, sh exits with 130 (128</text>
<text x="928" y="241" fill="#111">+ SIGINT)</text>
<text x="928" y="258" fill="#111">sleep 601 ignores SIGINT and keeps</text>
<text x="928" y="275" fill="#111">running</text>
<rect x="628" y="312" width="274" height="46" rx="6" fill="#fff4d6" stroke="#b54708" stroke-width="1.5"/>
<text x="638" y="330" fill="#111">sh, the program the terminal was</text>
<text x="638" y="347" fill="#111">opened for, is gone</text>
<rect x="918" y="312" width="334" height="46" rx="6" fill="#e7f6ec" stroke="#067647" stroke-width="1.5"/>
<text x="928" y="330" fill="#111">A hang-up signal (SIGHUP) reaches sleep</text>
<text x="928" y="347" fill="#111">601. It does not ignore SIGHUP: it stops</text>
<rect x="108" y="384" width="214" height="46" rx="6" fill="#e7f6ec" stroke="#067647" stroke-width="1.5"/>
<text x="118" y="402" fill="#111">Result: exit 130, no</text>
<text x="118" y="419" fill="#111">leftovers</text>
<rect x="108" y="456" width="214" height="46" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="118" y="474" fill="#111">Result: exit 130,</text>
<text x="118" y="491" fill="#111">leftover: sleep 601</text>
<rect x="918" y="456" width="334" height="46" rx="6" fill="#fde8e8" stroke="#b42318" stroke-width="1.5"/>
<text x="928" y="474" fill="#111">sleep 601 ignores SIGHUP too: it</text>
<text x="928" y="491" fill="#111">survives both signals</text>
<line x1="902" y1="246.0" x2="918" y2="246.0" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<line x1="902" y1="335.0" x2="918" y2="335.0" stroke="#b42318" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="20" y="542" font-size="12" fill="#475467">The two runs differ only in the trap line, so the hang-up is what cleaned up sleep 601.</text>
</svg>